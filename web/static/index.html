<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Takatsuki AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #090a0f;
            --sidebar-bg: #10121a;
            --card-bg: #161922;
            --card-hover: #1e2230;
            --border: #222634;
            --text-main: #e2e5f0;
            --text-muted: #838ba6;
            --accent: #5e72e4;
            --accent-hover: #4d61d1;
            --danger: #e65054;
            --danger-hover: #d03e42;
            --user-msg: #1a2030;
            --bot-msg: #12151f;
            --chat-font-size: 0.94rem;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        #sidebar {
            width: 290px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 12px;
        }

        .brand-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 4px 2px 10px;
            border-bottom: 1px solid var(--border);
        }

        .avatar-brand {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent);
            box-shadow: 0 0 10px rgba(94, 114, 228, 0.25);
            flex-shrink: 0;
        }

        .brand-info {
            display: flex;
            flex-direction: column;
            flex: 1;
            gap: 2px;
        }

        .brand-name {
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-status {
            font-size: 0.72rem;
            color: #2ed573;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .brand-status::before {
            content: "";
            width: 6px;
            height: 6px;
            background: #2ed573;
            border-radius: 50%;
            display: inline-block;
        }

        .badge {
            font-size: 0.65rem;
            font-weight: 600;
            padding: 1px 5px;
            background: var(--accent);
            color: #fff;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .btn-new-chat {
            width: 100%;
            padding: 10px 14px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 0.88rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: background 0.15s ease;
        }

        .btn-new-chat:hover {
            background: var(--accent-hover);
        }

        .label {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .select-box {
            width: 100%;
            padding: 8px 10px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-main);
            font-family: inherit;
            font-size: 0.84rem;
            outline: none;
            cursor: pointer;
        }

        .zoom-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .zoom-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.74rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .zoom-slider {
            width: 100%;
            height: 5px;
            border-radius: 3px;
            background: var(--border);
            outline: none;
            cursor: pointer;
            accent-color: var(--accent);
        }

        #sessions-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-top: 2px;
        }

        .session-item {
            padding: 9px 12px;
            background: transparent;
            border-radius: 6px;
            font-size: 0.84rem;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.15s ease;
        }

        .session-item:hover {
            background: var(--card-hover);
            color: var(--text-main);
        }

        .session-item.active {
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border);
            font-weight: 500;
        }

        .session-title {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 195px;
        }

        .session-del {
            font-size: 0.85rem;
            color: var(--text-muted);
            opacity: 0;
            padding: 2px 4px;
            border-radius: 4px;
        }

        .session-item:hover .session-del {
            opacity: 0.7;
        }

        .session-del:hover {
            opacity: 1 !important;
            color: var(--danger);
        }

        #main {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        #chat-window {
            flex: 1;
            overflow-y: auto;
            padding: 24px 32px;
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .msg-container {
            max-width: 860px;
            display: flex;
            gap: 14px;
            align-items: flex-start;
        }

        .msg-container.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .msg-container.bot {
            align-self: flex-start;
        }

        .msg-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            flex-shrink: 0;
            margin-top: 2px;
        }

        .msg-body {
            display: flex;
            flex-direction: column;
            gap: 5px;
            max-width: 780px;
        }

        .msg-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .msg-sender {
            font-size: 0.74rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .msg-actions {
            opacity: 0;
            display: flex;
            gap: 8px;
            font-size: 0.74rem;
            transition: opacity 0.15s ease;
        }

        .msg-container:hover .msg-actions {
            opacity: 1;
        }

        .action-btn {
            color: var(--text-muted);
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            transition: all 0.15s ease;
        }

        .action-btn:hover {
            color: var(--text-main);
            border-color: var(--accent);
        }

        .action-btn.del:hover {
            color: var(--danger);
            border-color: var(--danger);
        }

        .msg-bubble {
            padding: 14px 18px;
            border-radius: 10px;
            font-size: var(--chat-font-size);
            line-height: 1.62;
            white-space: pre-wrap;
            word-break: break-word;
            transition: font-size 0.1s ease;
        }

        .msg-container.user .msg-bubble {
            background: var(--user-msg);
            border: 1px solid #2e3852;
        }

        .msg-container.bot .msg-bubble {
            background: var(--bot-msg);
            border: 1px solid var(--border);
        }

        #composer {
            padding: 16px 32px 24px;
            background: var(--sidebar-bg);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
            align-items: center;
        }

        #input-box {
            flex: 1;
            padding: 12px 16px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-main);
            font-family: inherit;
            font-size: var(--chat-font-size);
            outline: none;
            resize: none;
            height: 46px;
        }

        #input-box:focus {
            border-color: var(--accent);
        }

        .btn {
            height: 46px;
            padding: 0 22px;
            border-radius: 6px;
            font-weight: 500;
            font-size: 0.88rem;
            cursor: pointer;
            border: none;
            transition: background 0.15s ease;
        }

        #send-btn {
            background: var(--accent);
            color: #fff;
        }

        #send-btn:hover {
            background: var(--accent-hover);
        }

        #cancel-btn {
            background: var(--danger);
            color: #fff;
            display: none;
        }

        #cancel-btn:hover {
            background: var(--danger-hover);
        }
    </style>
</head>
<body>
    <div id="sidebar">
        <div class="brand-header">
            <img src="/avatar.png" alt="Sen Takatsuki" class="avatar-brand" onerror="this.style.display='none'" />
            <div class="brand-info">
                <div class="brand-name">
                    Sen Takatsuki
                    <span class="badge">Eto</span>
                </div>
                <div class="brand-status">Online</div>
            </div>
        </div>

        <button id="btn-new-chat" class="btn-new-chat">+ New Chat</button>

        <div class="label">Model</div>
        <select id="model-select" class="select-box">
            <option value="Takatsuki-8B" selected>Takatsuki-8B (Flagship)</option>
            <option value="Takatsuki-3B">Takatsuki-3B (Fast Pragmatic)</option>
            <option value="Takatsuki-150M">Takatsuki-150M (From Scratch)</option>
        </select>

        <div class="zoom-card">
            <div class="zoom-header">
                <span>Text Zoom</span>
                <span id="zoom-val">100%</span>
            </div>
            <input type="range" id="zoom-slider" min="80" max="150" value="100" class="zoom-slider" />
        </div>

        <div class="label">Conversations</div>
        <div id="sessions-list"></div>
    </div>

    <div id="main">
        <div id="chat-window"></div>

        <div id="composer">
            <textarea id="input-box" placeholder="Say something to Sen..." rows="1"></textarea>
            <button id="send-btn" class="btn">Send</button>
            <button id="cancel-btn" class="btn">Cancel Query</button>
        </div>
    </div>

    <script>
        const chatWindow = document.getElementById('chat-window');
        const inputBox = document.getElementById('input-box');
        const sendBtn = document.getElementById('send-btn');
        const cancelBtn = document.getElementById('cancel-btn');
        const modelSelect = document.getElementById('model-select');
        const sessionsList = document.getElementById('sessions-list');
        const btnNewChat = document.getElementById('btn-new-chat');
        const zoomSlider = document.getElementById('zoom-slider');
        const zoomVal = document.getElementById('zoom-val');

        let currentSessionId = localStorage.getItem('active_session_id') || 'default_session';
        let currentAbortController = null;
        let messageHistory = [];

        // Apply saved zoom level
        const savedZoom = localStorage.getItem('chat_zoom') || '100';
        zoomSlider.value = savedZoom;
        applyZoom(savedZoom);

        function applyZoom(val) {
            zoomVal.innerText = `${val}%`;
            const baseRem = 0.94;
            const newRem = (baseRem * (parseInt(val) / 100)).toFixed(3);
            document.documentElement.style.setProperty('--chat-font-size', `${newRem}rem`);
            localStorage.setItem('chat_zoom', val);
        }

        zoomSlider.addEventListener('input', (e) => applyZoom(e.target.value));

        async function loadSessions() {
            try {
                const res = await fetch('/api/sessions');
                const data = await res.json();
                sessionsList.innerHTML = '';

                if (!data.sessions || data.sessions.length === 0) {
                    await createNewSession();
                    return;
                }

                let foundActive = false;
                data.sessions.forEach(sess => {
                    if (sess.id === currentSessionId) foundActive = true;
                    const item = document.createElement('div');
                    item.className = `session-item ${sess.id === currentSessionId ? 'active' : ''}`;
                    item.innerHTML = `
                        <span class="session-title">${escapeHtml(sess.title || 'Dialogue')}</span>
                        <span class="session-del" title="Delete Chat" onclick="deleteSession(event, '${sess.id}')">✕</span>
                    `;
                    item.addEventListener('click', (e) => {
                        if (!e.target.classList.contains('session-del')) {
                            switchSession(sess.id);
                        }
                    });
                    sessionsList.appendChild(item);
                });

                if (!foundActive && data.sessions.length > 0) {
                    switchSession(data.sessions[0].id);
                } else {
                    loadHistory(currentSessionId);
                }
            } catch (err) {
                console.error('Failed to load sessions:', err);
            }
        }

        async function createNewSession() {
            try {
                const res = await fetch('/api/sessions/new', { method: 'POST' });
                const data = await res.json();
                switchSession(data.session_id);
            } catch (err) {
                console.error('Failed to create session:', err);
            }
        }

        async function deleteSession(e, sessionId) {
            e.stopPropagation();
            if (!confirm('Permanently erase this conversation from the database?')) return;
            try {
                await fetch(`/api/sessions/${sessionId}`, { method: 'DELETE' });
                if (currentSessionId === sessionId) {
                    localStorage.removeItem('active_session_id');
                }
                loadSessions();
            } catch (err) {
                console.error('Failed to delete session:', err);
            }
        }

        function switchSession(sessionId) {
            currentSessionId = sessionId;
            localStorage.setItem('active_session_id', sessionId);
            loadSessions();
        }

        async function loadHistory(sessionId) {
            try {
                const res = await fetch(`/api/history/${sessionId}`);
                const data = await res.json();
                chatWindow.innerHTML = '';
                messageHistory = [];

                if (!data.history || data.history.length === 0) {
                    appendGreeting();
                    return;
                }

                data.history.forEach(msg => {
                    messageHistory.push({ role: msg.role, content: msg.content });
                    renderMessageRow(msg.id, msg.role, msg.content);
                });

                chatWindow.scrollTop = chatWindow.scrollHeight;
            } catch (err) {
                console.error('Failed to load history:', err);
                appendGreeting();
            }
        }

        function appendGreeting() {
            renderMessageRow(null, 'assistant', "Well, look who finally decided to show up. What kind of puzzle, bad idea, or code mess are we dissecting today?");
        }

        function renderMessageRow(msgId, role, content) {
            const container = document.createElement('div');
            container.className = `msg-container ${role === 'user' ? 'user' : 'bot'}`;
            if (msgId) container.dataset.msgId = msgId;

            if (role !== 'user') {
                const avatar = document.createElement('img');
                avatar.src = '/avatar.png';
                avatar.alt = 'Sen Takatsuki';
                avatar.className = 'msg-avatar';
                avatar.onerror = () => { avatar.style.display = 'none'; };
                container.appendChild(avatar);
            }

            const body = document.createElement('div');
            body.className = 'msg-body';

            const header = document.createElement('div');
            header.className = 'msg-header';

            const sender = document.createElement('div');
            sender.className = 'msg-sender';
            sender.innerText = role === 'user' ? 'You' : 'Sen Takatsuki';
            header.appendChild(sender);

            if (msgId) {
                const actions = document.createElement('div');
                actions.className = 'msg-actions';
                
                const rewindBtn = document.createElement('span');
                rewindBtn.className = 'action-btn';
                rewindBtn.innerText = 'Rewind here';
                rewindBtn.title = 'Revert conversation up to this message';
                rewindBtn.onclick = () => rewindTo(msgId);

                const delBtn = document.createElement('span');
                delBtn.className = 'action-btn del';
                delBtn.innerText = 'Delete turn';
                delBtn.title = 'Permanently erase this exchange from database';
                delBtn.onclick = () => deleteTurn(msgId);

                actions.appendChild(rewindBtn);
                actions.appendChild(delBtn);
                header.appendChild(actions);
            }

            const bubble = document.createElement('div');
            bubble.className = 'msg-bubble';
            bubble.innerText = content;

            body.appendChild(header);
            body.appendChild(bubble);
            container.appendChild(body);
            chatWindow.appendChild(container);
            return bubble;
        }

        async function deleteTurn(msgId) {
            try {
                await fetch(`/api/messages/${msgId}`, { method: 'DELETE' });
                loadHistory(currentSessionId);
            } catch (err) {
                console.error('Failed to delete turn:', err);
            }
        }

        async function rewindTo(msgId) {
            try {
                await fetch(`/api/messages/rewind/${msgId}`, { method: 'POST' });
                loadHistory(currentSessionId);
            } catch (err) {
                console.error('Failed to rewind:', err);
            }
        }

        async function sendMessage() {
            const text = inputBox.value.trim();
            if (!text) return;

            inputBox.value = '';
            messageHistory.push({ role: 'user', content: text });
            renderMessageRow(null, 'user', text);

            sendBtn.style.display = 'none';
            cancelBtn.style.display = 'inline-block';
            inputBox.disabled = true;

            const botBubble = renderMessageRow(null, 'assistant', '');
            currentAbortController = new AbortController();

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        session_id: currentSessionId,
                        model: modelSelect.value,
                        messages: messageHistory,
                        temperature: 0.75,
                        max_tokens: 1024
                    }),
                    signal: currentAbortController.signal
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullResponse = '';

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split('\n');
                    for (const rawLine of lines) {
                        const line = rawLine.trim();
                        if (line.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(line.substring(6));
                                if (data.delta) {
                                    fullResponse += data.delta;
                                    botBubble.innerText = fullResponse;
                                    chatWindow.scrollTop = chatWindow.scrollHeight;
                                }
                            } catch (err) {}
                        }
                    }
                }
                messageHistory.push({ role: 'assistant', content: fullResponse });
                loadSessions(); // Refresh titles in sidebar
            } catch (err) {
                if (err.name === 'AbortError') {
                    botBubble.innerText += "\n[Query cancelled by user.]";
                } else {
                    botBubble.innerText = "\n[Error streaming response.]";
                }
            } finally {
                currentAbortController = null;
                sendBtn.style.display = 'inline-block';
                cancelBtn.style.display = 'none';
                inputBox.disabled = false;
                inputBox.focus();
            }
        }

        function cancelQuery() {
            if (currentAbortController) {
                currentAbortController.abort();
            }
        }

        function escapeHtml(str) {
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        btnNewChat.addEventListener('click', createNewSession);
        sendBtn.addEventListener('click', sendMessage);
        cancelBtn.addEventListener('click', cancelQuery);
        inputBox.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Initialize sessions on page load
        loadSessions();
    </script>
</body>
</html>
