<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Takatsuki AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #090a0f;
            --sidebar-bg: #10121a;
            --card-bg: #161922;
            --border: #222634;
            --text-main: #e2e5f0;
            --text-muted: #838ba6;
            --accent: #5e72e4;
            --accent-hover: #4d61d1;
            --danger: #e65054;
            --danger-hover: #d03e42;
            --user-msg: #1c2234;
            --bot-msg: #131620;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        #sidebar {
            width: 260px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 20px 16px;
        }

        .brand {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .badge {
            font-size: 0.68rem;
            font-weight: 600;
            padding: 2px 6px;
            background: var(--accent);
            color: #fff;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .label {
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .select-box {
            width: 100%;
            padding: 9px 12px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-main);
            font-family: inherit;
            font-size: 0.88rem;
            outline: none;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .info-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 12px;
            font-size: 0.78rem;
            line-height: 1.45;
            color: var(--text-muted);
            margin-top: auto;
        }

        .info-card strong {
            color: var(--text-main);
            display: block;
            margin-bottom: 4px;
        }

        #main {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        #chat-window {
            flex: 1;
            overflow-y: auto;
            padding: 24px 32px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .msg-row {
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .msg-row.user {
            align-self: flex-end;
        }

        .msg-row.bot {
            align-self: flex-start;
        }

        .msg-sender {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .msg-bubble {
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.92rem;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .msg-row.user .msg-bubble {
            background: var(--user-msg);
            border: 1px solid #2e3852;
        }

        .msg-row.bot .msg-bubble {
            background: var(--bot-msg);
            border: 1px solid var(--border);
        }

        #composer {
            padding: 16px 32px 24px;
            background: var(--sidebar-bg);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
            align-items: center;
        }

        #input-box {
            flex: 1;
            padding: 11px 14px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-main);
            font-family: inherit;
            font-size: 0.92rem;
            outline: none;
            resize: none;
            height: 44px;
        }

        #input-box:focus {
            border-color: var(--accent);
        }

        .btn {
            height: 44px;
            padding: 0 20px;
            border-radius: 6px;
            font-weight: 500;
            font-size: 0.88rem;
            cursor: pointer;
            border: none;
            transition: background 0.15s ease;
        }

        #send-btn {
            background: var(--accent);
            color: #fff;
        }

        #send-btn:hover {
            background: var(--accent-hover);
        }

        #cancel-btn {
            background: var(--danger);
            color: #fff;
            display: none;
        }

        #cancel-btn:hover {
            background: var(--danger-hover);
        }
    </style>
</head>
<body>
    <div id="sidebar">
        <div class="brand">
            Sen Takatsuki
            <span class="badge">Eto</span>
        </div>

        <div class="label">Engine Model</div>
        <select id="model-select" class="select-box">
            <option value="Takatsuki-8B" selected>Takatsuki-8B (16-Core EPYC)</option>
            <option value="Takatsuki-3B">Takatsuki-3B (Conversational)</option>
            <option value="Takatsuki-150M">Takatsuki-150M (From Scratch)</option>
        </select>

        <div class="info-card">
            <strong>Persona: Sen Takatsuki</strong>
            Uncensored author persona with cynical psychological depth, witty candor, and persistent memory.
        </div>
    </div>

    <div id="main">
        <div id="chat-window">
            <div class="msg-row bot">
                <div class="msg-sender">Sen Takatsuki</div>
                <div class="msg-bubble">Well, well... what kind of morbid curiosity or intriguing puzzle brings you to my desk today? Let's hear it.</div>
            </div>
        </div>

        <div id="composer">
            <textarea id="input-box" placeholder="Ask Sen Takatsuki anything..." rows="1"></textarea>
            <button id="send-btn" class="btn">Send</button>
            <button id="cancel-btn" class="btn">Cancel Query</button>
        </div>
    </div>

    <script>
        const chatWindow = document.getElementById('chat-window');
        const inputBox = document.getElementById('input-box');
        const sendBtn = document.getElementById('send-btn');
        const cancelBtn = document.getElementById('cancel-btn');
        const modelSelect = document.getElementById('model-select');

        let messageHistory = [];
        let currentAbortController = null;
        const sessionId = "session_" + Math.random().toString(36).substring(2, 9);

        async function sendMessage() {
            const text = inputBox.value.trim();
            if (!text) return;

            inputBox.value = '';
            appendMessage('user', text);
            messageHistory.push({ role: 'user', content: text });

            // Toggle Send / Cancel buttons
            sendBtn.style.display = 'none';
            cancelBtn.style.display = 'inline-block';
            inputBox.disabled = true;

            const botBubble = appendMessage('bot', '');
            currentAbortController = new AbortController();

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        session_id: sessionId,
                        model: modelSelect.value,
                        messages: messageHistory,
                        temperature: 0.7,
                        max_tokens: 1024
                    }),
                    signal: currentAbortController.signal
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullResponse = '';

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(line.substring(6));
                                if (data.delta) {
                                    fullResponse += data.delta;
                                    botBubble.innerText = fullResponse;
                                    chatWindow.scrollTop = chatWindow.scrollHeight;
                                }
                            } catch (e) {}
                        }
                    }
                }
                messageHistory.push({ role: 'assistant', content: fullResponse });
            } catch (err) {
                if (err.name === 'AbortError') {
                    botBubble.innerText += "\n[Query cancelled by user.]";
                } else {
                    botBubble.innerText = "\n[Error streaming response.]";
                }
            } finally {
                currentAbortController = null;
                sendBtn.style.display = 'inline-block';
                cancelBtn.style.display = 'none';
                inputBox.disabled = false;
                inputBox.focus();
            }
        }

        function cancelQuery() {
            if (currentAbortController) {
                currentAbortController.abort();
            }
        }

        function appendMessage(role, content) {
            const row = document.createElement('div');
            row.className = `msg-row ${role}`;
            
            const sender = document.createElement('div');
            sender.className = 'msg-sender';
            sender.innerText = role === 'user' ? 'You' : 'Sen Takatsuki';
            
            const bubble = document.createElement('div');
            bubble.className = 'msg-bubble';
            bubble.innerText = content;

            row.appendChild(sender);
            row.appendChild(bubble);
            chatWindow.appendChild(row);
            chatWindow.scrollTop = chatWindow.scrollHeight;
            return bubble;
        }

        sendBtn.addEventListener('click', sendMessage);
        cancelBtn.addEventListener('click', cancelQuery);
        inputBox.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
