# Architecture Configuration for 150M Parameter SLM
model:
  dim: 768
  n_layers: 12
  n_heads: 12
  n_kv_heads: 4
  vocab_size: 32768
  max_seq_len: 2048
  rope_theta: 10000.0
  norm_eps: 1.0e-5
  tie_word_embeddings: true

training:
  batch_size: 16
  max_lr: 6.0e-4
  min_lr: 6.0e-5
  warmup_steps: 1000
  max_steps: 50000
  grad_clip: 1.0
  weight_decay: 0.1
  log_interval: 10
  save_interval: 2500
  checkpoint_dir: "checkpoints/150m"

data:
  train_bin: "data/tokenized/train.bin"
  val_bin: "data/tokenized/val.bin"
